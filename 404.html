<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Variant View</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2310151E'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-style='italic' font-size='34' fill='%2300A868' text-anchor='middle'%3EV%C2%B7V%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFBF8;--ink:#10151E;--ink-soft:#4A5261;--green-deep:#03734A;--line:#E3E2DB}
html[data-theme="dark"]{--paper:#0E1219;--ink:#EDEFF2;--ink-soft:#9AA3B2;--green-deep:#2BD98F;--line:#242B37}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.mono{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--green-deep);margin-bottom:18px}
h1{font-family:'Newsreader',serif;font-weight:400;font-size:clamp(2rem,6vw,3.4rem);line-height:1.15;max-width:22ch}
h1 em{font-style:italic;font-weight:500}
p{color:var(--ink-soft);margin-top:18px;max-width:44ch}
a.btn{display:inline-block;margin-top:30px;text-decoration:none;font-weight:600;font-size:.9rem;
  padding:12px 24px;border-radius:8px;background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
a.btn:hover{opacity:.88}
</style>
</head>
<body>
<div>
  <p class="mono">Error 404 · Page not found</p>
  <h1>This page has a <em>variant view</em> — it disagrees with your URL.</h1>
  <p>The page you're looking for doesn't exist, or has moved. The research, however, is exactly where it should be.</p>
  <a class="btn" href="/">Back to Variant View</a>
</div>
<script>
try{var t=localStorage.getItem('vv-theme');
if(t){document.documentElement.setAttribute('data-theme',t)}
else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}
</script>
</body>
</html>
